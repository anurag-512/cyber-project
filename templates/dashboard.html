<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Dashboard - Cyber Crime Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            flex: 1;
            min-width: 150px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        /* Tab Styles */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            background: white;
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .tab-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: #f0f0f0;
            color: #555;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
        }

        .tab-btn:hover:not(.active) {
            background: #e0e0e0;
        }

        .controls {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
        }

        .btn-pdf {
            background: #dc2626;
            color: white;
        }

        .btn-pdf:hover {
            background: #b91c1c;
            transform: translateY(-2px);
        }

        .btn-refresh {
            background: #f59e0b;
            color: white;
        }

        .btn-refresh:hover {
            background: #d97706;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background: #b91c1c;
            transform: translateY(-2px);
        }

        .table-container {
            background: white;
            border-radius: 15px;
            overflow-x: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f7f7f7;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #e0e0e0;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .map-link {
            background: #4299e1;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            transition: all 0.3s;
            display: inline-block;
        }

        .map-link:hover {
            background: #3182ce;
        }

        .photo-link {
            background: #8b5cf6;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            transition: all 0.3s;
            display: inline-block;
            margin-left: 5px;
        }

        .photo-link:hover {
            background: #7c3aed;
            transform: translateY(-1px);
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            border: none;
            margin-left: 8px;
            transition: all 0.3s;
            display: inline-block;
        }

        .delete-btn:hover {
            background: #b91c1c;
            transform: translateY(-1px);
        }

        .live-badge {
            background: #22c55e;
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 20px;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding: 20px;
        }

        .page-btn {
            padding: 8px 15px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .page-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .page-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #666;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        .confirm-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            animation: fadeIn 0.3s ease-in;
        }

        .modal-content h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .modal-content p {
            margin-bottom: 10px;
            color: #666;
        }

        .modal-content button {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-confirm {
            background: #dc2626;
            color: white;
        }

        .btn-confirm:hover {
            background: #b91c1c;
        }

        .btn-cancel {
            background: #9ca3af;
            color: white;
        }

        .btn-cancel:hover {
            background: #6b7280;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            float: right;
            margin-top: -50px;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        .badge-new {
            background: #10b981;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 8px;
        }
        
        .initial-badge {
            background: #667eea;
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header clearfix">
            <a href="/logout" class="logout-btn">🚪 Logout</a>
            <h1>📍 Cyber Crime Investigation Portal</h1>
            <p>Location Records Dashboard</p>
            <div class="stats-bar">
                <div class="stat-card">
                    <div class="stat-number" id="totalRecords">0</div>
                    <div class="stat-label">Initial Records (With Photo)</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);">
                    <div class="stat-number" id="liveRecords">0</div>
                    <div class="stat-label">Live Tracking Updates</div>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('initial')">📸 Initial Locations <span class="initial-badge">With Photo</span></button>
            <button class="tab-btn" onclick="switchTab('live')">📍 Live Tracking <span class="live-badge">LIVE</span></button>
        </div>

        <div class="controls" id="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search by ID or Timestamp...">
            <button class="btn btn-primary" onclick="searchLocations()">Search</button>
            <button class="btn btn-success" onclick="exportCSV()">📥 Export to CSV</button>
            <button class="btn btn-pdf" onclick="exportPDF()">📄 Export to PDF</button>
            <button class="btn btn-refresh" onclick="refreshCurrentTab()">🔄 Refresh</button>
            <button class="btn btn-danger" onclick="confirmDeleteAll()">🗑️ Delete All</button>
        </div>

        <div class="table-container">
            <div id="tableContent">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading records...
                </div>
            </div>
        </div>

        <div id="pagination" class="pagination"></div>
    </div>

    <script>
        let currentPage = 0;
        let currentSearch = '';
        let currentTab = 'initial';
        const limit = 20;
        let refreshInterval = null;

        function loadStats() {
            fetch('/api/stats')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('totalRecords').innerText = data.total_records || 0;
                    document.getElementById('liveRecords').innerText = data.live_records || 0;
                })
                .catch(err => console.error('Stats error:', err));
        }

        function switchTab(tab) {
            currentTab = tab;
            currentPage = 0;
            currentSearch = '';
            document.getElementById('searchInput').value = '';
            
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (tab === 'initial') {
                loadInitialLocations();
                if (refreshInterval) clearInterval(refreshInterval);
            } else {
                loadLiveLocations();
                if (refreshInterval) clearInterval(refreshInterval);
                refreshInterval = setInterval(() => {
                    if (currentTab === 'live') {
                        loadLiveLocations();
                    }
                }, 10000);
            }
        }

        function refreshCurrentTab() {
            if (currentTab === 'initial') {
                loadInitialLocations();
            } else {
                loadLiveLocations();
            }
            loadStats();
        }

        function loadInitialLocations() {
            const offset = currentPage * limit;
            let url = `/api/locations?limit=${limit}&offset=${offset}`;
            if (currentSearch) {
                url += `&search=${encodeURIComponent(currentSearch)}`;
            }

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    // Filter ONLY initial tracking type (not live)
                    const initialLocations = data.locations.filter(loc => loc.tracking_type !== 'live');
                    const sortedLocations = initialLocations.sort((a, b) => b.id - a.id);
                    displayInitialLocations(sortedLocations, currentPage);
                    displayPagination(initialLocations.length, currentPage, currentSearch);
                })
                .catch(err => {
                    document.getElementById('tableContent').innerHTML = 
                        '<div class="loading">❌ Error loading records</div>';
                    console.error('Error:', err);
                });
        }

        function loadLiveLocations() {
            fetch('/api/live-locations')
                .then(res => res.json())
                .then(data => {
                    const sortedLocations = data.locations.sort((a, b) => b.id - a.id);
                    displayLiveLocations(sortedLocations);
                    document.getElementById('pagination').innerHTML = '';
                })
                .catch(err => {
                    document.getElementById('tableContent').innerHTML = 
                        '<div class="loading">❌ Error loading live locations</div>';
                    console.error('Error:', err);
                });
        }

        function displayInitialLocations(locations, page) {
            if (!locations || locations.length === 0) {
                document.getElementById('tableContent').innerHTML = 
                    '<div class="loading">📭 No initial records found</div>';
                return;
            }

            let html = `<table><thead><tr>
                <th>S.No</th>
                <th>ID</th>
                <th>Latitude</th>
                <th>Longitude</th>
                <th>Accuracy (m)</th>
                <th>Timestamp (IST)</th>
                <th>Photo</th>
                <th>Action</th>
            </tr></thead><tbody>`;

            let serialNo = (page * limit) + 1;
            
            locations.forEach(loc => {
                html += `<tr>
                    <td>${serialNo++}</td>
                    <td>${loc.id}${loc.id > 15 ? ' <span class="badge-new">New</span>' : ''}</td>
                    <td>${loc.latitude}</td>
                    <td>${loc.longitude}</td>
                    <td>${loc.accuracy || 'N/A'}</td>
                    <td>${loc.timestamp}</td>
                    <td>
                        ${loc.has_photo ? `<a href="/api/photo/${loc.id}" target="_blank" class="photo-link">📷 View Photo</a>` : '<span style="color: #999; font-size: 12px;">No Photo</span>'}
                    </td>
                    <td>
                        <a href="https://maps.google.com/?q=${loc.latitude},${loc.longitude}" 
                           target="_blank" class="map-link">🗺️ Map</a>
                        <button onclick="confirmDelete(${loc.id})" class="delete-btn">🗑️ Delete</button>
                    </td>
                </tr>`;
            });

            html += `</tbody></tr>`;
            document.getElementById('tableContent').innerHTML = html;
        }

        function displayLiveLocations(locations) {
            if (!locations || locations.length === 0) {
                document.getElementById('tableContent').innerHTML = 
                    '<div class="loading">📍 No live tracking data yet.</div>';
                return;
            }

            let html = `<table><thead><tr>
                <th>S.No</th>
                <th>Latitude</th>
                <th>Longitude</th>
                <th>Accuracy (m)</th>
                <th>Timestamp (IST)</th>
                <th>Status</th>
                <th>Action</th>
            </tr></thead><tbody>`;

            locations.forEach((loc, idx) => {
                const time = new Date(loc.timestamp);
                const now = new Date();
                const diffMs = now - time;
                const diffMins = Math.floor(diffMs / 60000);
                const diffSecs = Math.floor((diffMs % 60000) / 1000);
                let statusHtml = '';
                
                if (diffMins < 1) {
                    statusHtml = `<span class="live-badge">🟢 LIVE (${diffSecs}s ago)</span>`;
                } else if (diffMins < 5) {
                    statusHtml = `<span style="color: #f59e0b;">🟡 ${diffMins} mins ago</span>`;
                } else {
                    statusHtml = `<span style="color: #ef4444;">🔴 ${diffMins} mins ago</span>`;
                }
                
                html += `<tr>
                    <td>${idx + 1}</td>
                    <td>${loc.latitude}</td>
                    <td>${loc.longitude}</td>
                    <td>${loc.accuracy || 'N/A'}m</td>
                    <td>${loc.timestamp}</td>
                    <td>${statusHtml}</td>
                    <td>
                        <a href="https://maps.google.com/?q=${loc.latitude},${loc.longitude}" 
                           target="_blank" class="map-link">🗺️ Map</a>
                    </td>
                </tr>`;
            });

            html += `</tbody></table>`;
            document.getElementById('tableContent').innerHTML = html;
        }

        function displayPagination(total, currentPageNum, search) {
            const totalPages = Math.ceil(total / limit);
            if (totalPages <= 1) {
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            let html = '';
            for (let i = 0; i < totalPages; i++) {
                html += `<button class="page-btn ${i === currentPageNum ? 'active' : ''}" 
                                onclick="goToPage(${i})">${i + 1}</button>`;
            }
            document.getElementById('pagination').innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            if (currentTab === 'initial') {
                loadInitialLocations();
            } else {
                loadLiveLocations();
            }
        }

        function searchLocations() {
            if (currentTab === 'initial') {
                currentSearch = document.getElementById('searchInput').value;
                currentPage = 0;
                loadInitialLocations();
            } else {
                showToast('🔍 Search only available in Initial Locations tab', 'info');
            }
        }

        function exportCSV() {
            let url = '/api/export-csv';
            if (currentTab === 'initial' && currentSearch) {
                url += `?search=${encodeURIComponent(currentSearch)}`;
            }
            window.open(url, '_blank');
        }

        function exportPDF() {
            let url = '/api/export-pdf';
            if (currentTab === 'initial' && currentSearch) {
                url += `?search=${encodeURIComponent(currentSearch)}`;
            }
            window.open(url, '_blank');
        }

        function confirmDeleteAll() {
            const modal = document.createElement('div');
            modal.className = 'confirm-modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3>⚠️ Delete All Records</h3>
                    <p>Are you sure you want to delete <strong>ALL records</strong>?</p>
                    <p style="color: #dc2626; font-size: 12px;">⚠️ This action cannot be undone!</p>
                    <div>
                        <button class="btn-confirm" onclick="deleteAllRecords()">Yes, Delete All</button>
                        <button class="btn-cancel" onclick="this.closest('.confirm-modal').remove()">Cancel</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function deleteAllRecords() {
            const modal = document.querySelector('.confirm-modal');
            if (modal) modal.remove();
            
            document.getElementById('tableContent').innerHTML = '<div class="loading"><div class="spinner"></div>Deleting all records...</div>';
            
            fetch('/api/delete-all', {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    if (currentTab === 'initial') {
                        loadInitialLocations();
                    } else {
                        loadLiveLocations();
                    }
                    loadStats();
                    showToast('✅ All records deleted successfully!', 'success');
                } else {
                    showToast('❌ Error: ' + data.message, 'error');
                }
            })
            .catch(error => {
                console.error('Delete all error:', error);
                showToast('❌ Network error! Please try again.', 'error');
            });
        }

        function confirmDelete(id) {
            const modal = document.createElement('div');
            modal.className = 'confirm-modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3>⚠️ Confirm Delete</h3>
                    <p>Are you sure you want to delete record <strong>ID: ${id}</strong>?</p>
                    <p style="color: #dc2626; font-size: 12px;">⚠️ This action cannot be undone!</p>
                    <div>
                        <button class="btn-confirm" onclick="deleteRecord(${id})">Yes, Delete</button>
                        <button class="btn-cancel" onclick="this.closest('.confirm-modal').remove()">Cancel</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function deleteRecord(id) {
            const modal = document.querySelector('.confirm-modal');
            if (modal) modal.remove();
            
            document.getElementById('tableContent').innerHTML = '<div class="loading"><div class="spinner"></div>Deleting record...</div>';
            
            fetch(`/api/delete-location/${id}`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    if (currentTab === 'initial') {
                        loadInitialLocations();
                    } else {
                        loadLiveLocations();
                    }
                    loadStats();
                    showToast('✅ Record deleted successfully!', 'success');
                } else {
                    showToast('❌ Error: ' + data.message, 'error');
                    if (currentTab === 'initial') {
                        loadInitialLocations();
                    } else {
                        loadLiveLocations();
                    }
                }
            })
            .catch(error => {
                console.error('Delete error:', error);
                showToast('❌ Network error! Please try again.', 'error');
                if (currentTab === 'initial') {
                    loadInitialLocations();
                } else {
                    loadLiveLocations();
                }
            });
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.right = '20px';
            toast.style.padding = '12px 20px';
            toast.style.borderRadius = '8px';
            toast.style.color = 'white';
            toast.style.zIndex = '1000';
            toast.style.animation = 'fadeIn 0.3s ease-in';
            toast.style.backgroundColor = type === 'success' ? '#10b981' : (type === 'info' ? '#f59e0b' : '#dc2626');
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Initial load
        loadStats();
        loadInitialLocations();
    </script>
</body>
</html>
