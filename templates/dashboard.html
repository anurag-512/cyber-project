<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Dashboard - Cyber Crime Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            flex: 1;
            min-width: 150px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .controls {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
        }

        .table-container {
            background: white;
            border-radius: 15px;
            overflow-x: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f7f7f7;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #e0e0e0;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .map-link {
            background: #4299e1;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            transition: all 0.3s;
        }

        .map-link:hover {
            background: #3182ce;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding: 20px;
        }

        .page-btn {
            padding: 8px 15px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .page-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .page-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #666;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📍 Cyber Crime Investigation Portal</h1>
            <p>Location Records Dashboard</p>
            <div class="stats-bar">
                <div class="stat-card">
                    <div class="stat-number" id="totalRecords">0</div>
                    <div class="stat-label">Total Records</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search by timestamp (e.g., 2024-12-25)...">
            <button class="btn btn-primary" onclick="searchLocations()">Search</button>
            <button class="btn btn-success" onclick="exportCSV()">📥 Export to CSV</button>
        </div>

        <div class="table-container">
            <div id="tableContent">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading records...
                </div>
            </div>
        </div>

        <div id="pagination" class="pagination"></div>
    </div>

    <script>
        let currentPage = 0;
        let currentSearch = '';
        const limit = 20;

        function loadStats() {
            fetch('/api/stats')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('totalRecords').innerText = data.total_records || 0;
                })
                .catch(err => console.error('Stats error:', err));
        }

        function loadLocations(page = 0, search = '') {
            const offset = page * limit;
            let url = `/api/locations?limit=${limit}&offset=${offset}`;
            if (search) {
                url += `&search=${encodeURIComponent(search)}`;
            }

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    displayLocations(data.locations);
                    displayPagination(data.total, page, search);
                })
                .catch(err => {
                    document.getElementById('tableContent').innerHTML = 
                        '<div class="loading">❌ Error loading records</div>';
                    console.error('Error:', err);
                });
        }

        function displayLocations(locations) {
            if (!locations || locations.length === 0) {
                document.getElementById('tableContent').innerHTML = 
                    '<div class="loading">📭 No records found</div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Latitude</th>
                            <th>Longitude</th>
                            <th>Accuracy (m)</th>
                            <th>Timestamp (IST)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            locations.forEach(loc => {
                html += `
                    <tr>
                        <td>${loc.id}</td>
                        <td>${loc.latitude}</td>
                        <td>${loc.longitude}</td>
                        <td>${loc.accuracy || 'N/A'}</td>
                        <td>${loc.timestamp}</td>
                        <td>
                            <a href="https://maps.google.com/?q=${loc.latitude},${loc.longitude}" 
                               target="_blank" 
                               class="map-link">
                                🗺️ Open Map
                            </a>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            document.getElementById('tableContent').innerHTML = html;
        }

        function displayPagination(total, currentPageNum, search) {
            const totalPages = Math.ceil(total / limit);
            if (totalPages <= 1) {
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            let html = '';
            for (let i = 0; i < totalPages; i++) {
                html += `<button class="page-btn ${i === currentPageNum ? 'active' : ''}" 
                                onclick="goToPage(${i})">${i + 1}</button>`;
            }
            document.getElementById('pagination').innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            loadLocations(currentPage, currentSearch);
        }

        function searchLocations() {
            currentSearch = document.getElementById('searchInput').value;
            currentPage = 0;
            loadLocations(currentPage, currentSearch);
        }

        function exportCSV() {
            let url = '/api/export-csv';
            if (currentSearch) {
                url += `?search=${encodeURIComponent(currentSearch)}`;
            }
            window.open(url, '_blank');
        }

        // Initial load
        loadStats();
        loadLocations(0, '');
    </script>
</body>
</html>
