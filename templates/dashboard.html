<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Dashboard - Cyber Crime Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            flex: 1;
            min-width: 150px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .controls {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
        }

        .table-container {
            background: white;
            border-radius: 15px;
            overflow-x: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f7f7f7;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #e0e0e0;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .map-link {
            background: #4299e1;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            transition: all 0.3s;
            display: inline-block;
        }

        .map-link:hover {
            background: #3182ce;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            border: none;
            margin-left: 8px;
            transition: all 0.3s;
            display: inline-block;
        }

        .delete-btn:hover {
            background: #b91c1c;
            transform: translateY(-1px);
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding: 20px;
        }

        .page-btn {
            padding: 8px 15px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .page-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .page-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #666;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        /* Modal Styles */
        .confirm-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            animation: fadeIn 0.3s ease-in;
        }

        .modal-content h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .modal-content p {
            margin-bottom: 10px;
            color: #666;
        }

        .modal-content button {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-confirm {
            background: #dc2626;
            color: white;
        }

        .btn-confirm:hover {
            background: #b91c1c;
        }

        .btn-cancel {
            background: #9ca3af;
            color: white;
        }

        .btn-cancel:hover {
            background: #6b7280;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            float: right;
            margin-top: -50px;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header clearfix">
            <a href="/logout" class="logout-btn">🚪 Logout</a>
            <h1>📍 Cyber Crime Investigation Portal</h1>
            <p>Location Records Dashboard</p>
            <div class="stats-bar">
                <div class="stat-card">
                    <div class="stat-number" id="totalRecords">0</div>
                    <div class="stat-label">Total Records</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search by timestamp (e.g., 2024-12-25)...">
            <button class="btn btn-primary" onclick="searchLocations()">Search</button>
            <button class="btn btn-success" onclick="exportCSV()">📥 Export to CSV</button>
        </div>

        <div class="table-container">
            <div id="tableContent">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading records...
                </div>
            </div>
        </div>

        <div id="pagination" class="pagination"></div>
    </div>

    <script>
        let currentPage = 0;
        let currentSearch = '';
        const limit = 20;

        function loadStats() {
            fetch('/api/stats')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('totalRecords').innerText = data.total_records || 0;
                })
                .catch(err => console.error('Stats error:', err));
        }

        function loadLocations(page = 0, search = '') {
            const offset = page * limit;
            let url = `/api/locations?limit=${limit}&offset=${offset}`;
            if (search) {
                url += `&search=${encodeURIComponent(search)}`;
            }

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    displayLocations(data.locations);
                    displayPagination(data.total, page, search);
                })
                .catch(err => {
                    document.getElementById('tableContent').innerHTML = 
                        '<div class="loading">❌ Error loading records</div>';
                    console.error('Error:', err);
                });
        }

        function displayLocations(locations) {
            if (!locations || locations.length === 0) {
                document.getElementById('tableContent').innerHTML = 
                    '<div class="loading">📭 No records found</div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Latitude</th>
                            <th>Longitude</th>
                            <th>Accuracy (m)</th>
                            <th>Timestamp (IST)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            locations.forEach(loc => {
                html += `
                    <tr>
                        <td>${loc.id}</td>
                        <td>${loc.latitude}</td>
                        <td>${loc.longitude}</td>
                        <td>${loc.accuracy || 'N/A'}</td>
                        <td>${loc.timestamp}</td>
                        <td>
                            <a href="https://maps.google.com/?q=${loc.latitude},${loc.longitude}" 
                               target="_blank" 
                               class="map-link">
                                🗺️ Map
                            </a>
                            <button onclick="confirmDelete(${loc.id})" class="delete-btn">
                                🗑️ Delete
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            document.getElementById('tableContent').innerHTML = html;
        }

        function displayPagination(total, currentPageNum, search) {
            const totalPages = Math.ceil(total / limit);
            if (totalPages <= 1) {
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            let html = '';
            for (let i = 0; i < totalPages; i++) {
                html += `<button class="page-btn ${i === currentPageNum ? 'active' : ''}" 
                                onclick="goToPage(${i})">${i + 1}</button>`;
            }
            document.getElementById('pagination').innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            loadLocations(currentPage, currentSearch);
        }

        function searchLocations() {
            currentSearch = document.getElementById('searchInput').value;
            currentPage = 0;
            loadLocations(currentPage, currentSearch);
        }

        function exportCSV() {
            let url = '/api/export-csv';
            if (currentSearch) {
                url += `?search=${encodeURIComponent(currentSearch)}`;
            }
            window.open(url, '_blank');
        }

        function confirmDelete(id) {
            const modal = document.createElement('div');
            modal.className = 'confirm-modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3>⚠️ Confirm Delete</h3>
                    <p>Are you sure you want to delete record <strong>ID: ${id}</strong>?</p>
                    <p style="color: #dc2626; font-size: 12px;">⚠️ This action cannot be undone!</p>
                    <div>
                        <button class="btn-confirm" onclick="deleteRecord(${id})">Yes, Delete</button>
                        <button class="btn-cancel" onclick="this.closest('.confirm-modal').remove()">Cancel</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function deleteRecord(id) {
            // Close modal
            const modal = document.querySelector('.confirm-modal');
            if (modal) modal.remove();
            
            // Show loading
            document.getElementById('tableContent').innerHTML = '<div class="loading"><div class="spinner"></div>Deleting record...</div>';
            
            fetch(`/api/delete-location/${id}`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    // Reload current page
                    loadLocations(currentPage, currentSearch);
                    loadStats();
                    showToast('✅ Record deleted successfully!', 'success');
                } else {
                    showToast('❌ Error: ' + data.message, 'error');
                    loadLocations(currentPage, currentSearch);
                }
            })
            .catch(error => {
                console.error('Delete error:', error);
                showToast('❌ Network error! Please try again.', 'error');
                loadLocations(currentPage, currentSearch);
            });
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.right = '20px';
            toast.style.padding = '12px 20px';
            toast.style.borderRadius = '8px';
            toast.style.color = 'white';
            toast.style.zIndex = '1000';
            toast.style.animation = 'fadeIn 0.3s ease-in';
            toast.style.backgroundColor = type === 'success' ? '#10b981' : '#dc2626';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Initial load
        loadStats();
        loadLocations(0, '');
    </script>
</body>
</html>
